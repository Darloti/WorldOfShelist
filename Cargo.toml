[package]
name = "WorldOfShelist"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace]
resolver = "3"
members = ["crates/app","crates/simulation","crates/world_core", "crates/world_data", "crates/worldgen"]

[dependencies]
macroquad = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = false
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
